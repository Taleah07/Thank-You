<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Interactive Thank You Card</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            perspective: 1000px; 
            user-select: none;
            -webkit-user-select: none; 
        }

        /* Canvas layered over everything */
        #confettiCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        .card-container {
            width: 90%;          
            max-width: 400px;    
            height: 250px;       
            cursor: pointer;
            touch-action: manipulation; 
            -webkit-tap-highlight-color: transparent; 
            position: relative;
            z-index: 1;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            border-radius: 16px;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 16px;
            background: rgb(224, 27, 224);
            padding: 24px;
            box-sizing: border-box;
        }

        .card-front h1 {
            color: black;
            font-size: 2.2rem;
            margin: 0;
            text-align: center;
        }
        .card-front p {
            color: black;
            font-size: 0.95rem;
            margin: 12px 0 0 0;
            text-align: center;
        }

        .card-back {
            transform: rotateY(180deg); 
            background: #ffffff;
            border: 2px dashed #c21bb9;
        }
        .card-back h2 {
            color: black;
            font-size: 1.5rem;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .card-back p {
            color: black;
            font-size: 1.05rem;
            text-align: center;
            line-height: 1.5;
            margin: 0;
        }

        @media (max-width: 360px) {
            .card-front h1 { font-size: 1.8rem; }
            .card-back p { font-size: 0.95rem; }
            .card-container { height: 220px; }
        }
    </style>
</head>
<body>

    <canvas id="confettiCanvas"></canvas>

    <div class="card-container" onclick="flipCard()">
        <div class="card" id="thankYouCard">
            <div class="card-front">
                <h1>To:Everyone!!🥹</h1>
                <p>Tap to turn over</p>
            </div>
            <div class="card-back">
                <h2>✨A Special Note✨</h2>
                <p>I just wanted to say thank you to everyone! You all were always nice to me. I'm glad I was a part of this team.I learnt a lot from you all and had a good 12 Months...</p>
                <h3>From: Taleah.G💕</h3>
            </div>
        </div>
    </div>

    <script>
        // Native Confetti System (No External Network Dependencies)
        const canvas = document.getElementById('confettiCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationFrameId;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createConfetti() {
            particles = [];
            const colors = ['#f22613', '#3a539b', '#00b16a', '#f9bf3b', '#9b59b6', '#00e676'];
            
            // Generate bits around the centered card region
            for (let i = 0; i < 120; i++) {
                particles.push({
                    x: canvas.width / 2 + (Math.random() * 40 - 20),
                    y: canvas.height / 2 + 50,
                    size: Math.random() * 6 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speedX: Math.random() * 10 - 5,
                    speedY: Math.random() * -15 - 5, // Launch upwards
                    gravity: 0.4,
                    rotation: Math.random() * 360,
                    rotationSpeed: Math.random() * 10 - 5
                });
            }
            
            cancelAnimationFrame(animationFrameId);
            animate();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); //
            let active = false;

            particles.forEach(p => {
                p.speedY += p.gravity;
                p.x += p.speedX;
                p.y += p.speedY;
                p.rotation += p.rotationSpeed;

                // Draw standard geometric square particle confetti
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation * Math.PI / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();

                // Keep rendering if particles are still visible on-screen
                if (p.y < canvas.height) {
                    active = true;
                }
            });

            if (active) {
                animationFrameId = requestAnimationFrame(animate); //
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        function flipCard() {
            const card = document.getElementById('thankYouCard');
            const isFlipped = card.classList.contains('flipped');
            card.classList.toggle('flipped');

            // Fire native confetti engine on the back-flip reveal
            if (!isFlipped) {
                setTimeout(() => {
                    createConfetti();
                }, 150);
            }
        }
    </script>
</body>
</html>
